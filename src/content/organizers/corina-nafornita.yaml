biography: >-
  Corina Nafornita is a Professor at Politehnica University of Timisoara,
  Romania, and a Senior Member of IEEE. She earned her Ph.D. in electronics
  and telecommunications at the Technical University of Cluj-Napoca in 2008
  and defended her Habilitation in 2015. Her research interests include
  signal and image processing, radar, machine learning, synthetic aperture
  radiometry, and wavelets. She serves as Vice-chair of the IEEE P3339
  Synthetic Aperture Radiometry Working Group and Chair of the IEEE P3520
  Machine Learning for Synthetic Apertures Working Group. She has published
  more than 80 papers.
