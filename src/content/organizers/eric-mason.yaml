biography: >-
  Eric Mason is Director of Data Science at HawkEye360, where he leads
  development of capabilities and products for space-based sensing,
  detection, identification, and tracking of RF emitters. He earned his
  Ph.D. in electrical engineering at Rensselaer Polytechnic Institute in 2017.
  From 2017 to 2021, he researched signal processing, machine learning,
  and optimization for radar and electronic warfare at the US Naval
  Research Laboratory. His work centers on cognitive RF systems, including
  a multinational cognitive electronic warfare prototype and the cognitive
  system behind HawkEye360's maritime domain products.
